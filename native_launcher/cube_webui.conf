# =============================================================================
# Cube WebUI launcher — project defaults (shipped with gVRMod)
# Override order (later wins): this file → ~/.config/gvrmod/cube_webui.conf
#   → $GMOD/garrysmod/data/vrmod/cube_webui.conf → CUBE_* env vars
# Restart launcher after edits (no recompile).
# =============================================================================

# Panel size & depth (meters). FOV-correct; these fill a comfortable Quest FOV.
panel_dist=1.05
panel_w=0.84
panel_h=0.48

# Fine placement offsets in VIEW space (meters). +X right, +Y up, +Z further.
panel_x=0.0
panel_y=0.0
panel_z=0.0

# 1 = menu follows head (default). 0 = world-lock after place / first frame.
view_lock=1

# 1 = prefer see-through (ALPHA_BLEND / FB passthrough when runtime supports it).
passthrough=1

# UI opacity over passthrough (0.4–1.0).
panel_alpha=0.96

# Grip squeeze threshold to grab & move the menu (0.2–1.0).
grab_thresh=0.55
