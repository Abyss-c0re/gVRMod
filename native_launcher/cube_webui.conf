# =============================================================================
# Cube WebUI launcher — project defaults (shipped with gVRMod)
# Override order (later wins): this file → ~/.config/gvrmod/cube_webui.conf
#   → $GMOD/garrysmod/data/vrmod/cube_webui.conf → CUBE_* env vars
# Restart launcher after edits (no recompile).
# =============================================================================

# Panel size & depth (meters). Larger for laser usability.
panel_dist=0.95
panel_w=1.05
panel_h=0.60

# Seed offsets (meters) applied once at anchor, then frozen in STAGE/LOCAL.
panel_x=0.0
panel_y=-0.05
panel_z=0.0

# 0 = world-locked floating panel (STAGE/LOCAL). PRODUCT DEFAULT.
# 1 = head-follow HUD (explicit opt-in only).
view_lock=0

# Prefer see-through (ALPHA_BLEND / FB passthrough when runtime supports it).
passthrough=1

# Fully opaque panel — translucent + red LEDs = unreadable wash.
panel_alpha=1.0

# Grip-to-move OFF by default. Resting squeeze was thrashing panel + blocking
# every trigger click (Meta Cam + WiVRn 041757). MENU re-anchors the panel.
# Set grab_enable=1 only if you want grip-drag again.
grab_enable=0
grab_thresh=0.92

# Quest float trigger axis threshold for UI click.
trigger_thresh=0.40
