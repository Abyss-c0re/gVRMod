# =============================================================================
# Cube WebUI launcher — project defaults (shipped with gVRMod)
# Override order (later wins): this file → ~/.config/gvrmod/cube_webui.conf
#   → $GMOD/garrysmod/data/vrmod/cube_webui.conf → CUBE_* env vars
# Restart launcher after edits (no recompile).
# =============================================================================

# Panel size & depth (meters). Larger for laser usability (Meta Cam review).
panel_dist=0.95
panel_w=1.05
panel_h=0.60

# Seed offsets (meters) applied once at anchor, then frozen in STAGE/LOCAL.
panel_x=0.0
panel_y=-0.05
panel_z=0.0

# 0 = world-locked floating panel (STAGE/LOCAL, grab to place). PRODUCT DEFAULT.
# 1 = head-follow HUD (explicit opt-in only — not Cube quality default).
view_lock=0

# Prefer see-through (ALPHA_BLEND / FB passthrough when runtime supports it).
passthrough=1

# UI opacity over passthrough (solid enough to kill red LED wash-through).
panel_alpha=0.98

# Grip squeeze threshold — raised so resting squeeze does not thrash-grab.
# Meta Cam 20260803: left squeeze was constantly moving panel (unusable).
grab_thresh=0.85
