# =============================================================================
# Cube WebUI launcher — project defaults (shipped with gVRMod)
# Override order (later wins): this file → ~/.config/gvrmod/cube_webui.conf
#   → $GMOD/garrysmod/data/vrmod/cube_webui.conf → CUBE_* env vars
# Restart launcher after edits (no recompile).
# =============================================================================

# Panel size & depth (meters). Comfortable Quest FOV.
panel_dist=1.05
panel_w=0.84
panel_h=0.48

# Seed offsets (meters) before world-lock freezes pose in LOCAL.
panel_x=0.0
panel_y=0.0
panel_z=0.0

# 0 = WayVR-style world-locked floating panel (grab to place). DEFAULT.
# 1 = head-follow HUD (optional; usually not wanted).
view_lock=0

# Prefer see-through (ALPHA_BLEND / FB passthrough when runtime supports it).
passthrough=1

# UI opacity over passthrough.
panel_alpha=0.96

# Grip squeeze threshold to grab & move the menu.
grab_thresh=0.55
