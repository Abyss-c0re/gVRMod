// CSSVRMod — exec'd after launch when you +exec cssvrmod
// Keep cheap; do not thrash mat_queue. CSS Linux is togl.
fps_max 0
mat_queue_mode 1
mat_vsync 0
cl_showfps 1
// Window chrome is forced by the hook; do not switch to fullscreen here.
// VR look is injected; keep mouse raw for snap-on-fire.
m_rawinput 1
// Backend: CSSVR --gl (default togl) / --dx9 (CreateTexture) / --vk (fallback)
// Honest: true stereo RenderView is not this cfg.
echo "[cssvrmod] cfg loaded — hook owns OpenXR"
