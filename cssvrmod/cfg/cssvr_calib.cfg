# CSSVR video calibration (same names as vrmod Vision)
# Copy/edit: ~/.config/gvrmod/cssvr_calib.cfg
# The hook reloads that file live — no restart.
#
# Dial order (vrmod_border_calibrate):
#   scalefactor → verticaloffset → horizontaloffset → eyescale
#
# Right eye too far apart: lower eyescale (try 0.15).
# Image too small / black borders: raise scalefactor (1.05–1.2).
# Whole image left/right: horizontaloffset (−1..1).
# Whole image up/down: verticaloffset (−1..1).

eyescale 0.25
horizontaloffset 0
verticaloffset 0
scalefactor 1
lens_bend 0
ipd_m 0.064
swap_eyes 0
